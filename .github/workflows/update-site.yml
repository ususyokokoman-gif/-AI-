name: Refresh Private AI Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/items.json'

permissions:
  contents: write

concurrency:
  group: private-ai-practice-radar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current AI practice information
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py
      - name: Commit updated private data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/items.json
          git diff --cached --quiet || git commit -m 'chore: refresh private AI radar data'
          git push
